<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack — Simple Workout Tracker</title>
    <meta name="description" content="FitTrack is a lightweight, private workout tracker that runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar__inner">
            <div class="brand" aria-label="FitTrack">
                <span class="brand__mark" aria-hidden="true">FT</span>
                <span class="brand__name">FitTrack</span>
            </div>

            <nav class="nav" aria-label="Primary">
                <a class="nav__link" href="#/dashboard" data-route="dashboard">Dashboard</a>
                <a class="nav__link" href="#/workout" data-route="workout">Log workout</a>
                <a class="nav__link" href="#/exercises" data-route="exercises">Exercises</a>
                <a class="nav__link" href="#/progress" data-route="progress">Progress</a>
                <a class="nav__link" href="#/settings" data-route="settings">Settings</a>
            </nav>

            <div class="topbar__actions">
                <button class="icon-btn" type="button" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                    <span aria-hidden="true">◐</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main" class="app" role="main">
        <section class="panel" id="appRoot" aria-live="polite">
            <div class="loading">
                <div class="loading__spinner" aria-hidden="true"></div>
                <div class="loading__text">Loading FitTrack…</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <div class="footer__left">
                <span class="muted">FitTrack runs locally in your browser.</span>
            </div>
            <div class="footer__right">
                <a class="footer__link" href="./privacypolicy/">Privacy policy</a>
                <span class="footer__dot" aria-hidden="true">·</span>
                <a class="footer__link" href="./README.md">README</a>
            </div>
        </div>
    </footer>

    <script defer src="./assets/app.js"></script>
</body>
</html>
